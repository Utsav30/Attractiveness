<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assignment 2-B</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">

<main class="auth-wrap">
  <header class="auth-head">
    <h1 id="studyName">Assignment 2-B</h1>
    <p class="muted">Sign in to continue, or create an account to start.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabLogin" role="tab">Log in</button>
    <button class="tab" id="tabSignup" role="tab">Sign up</button>
  </div>

  <!-- ------------------------------ LOGIN ------------------------------ -->
  <section class="card" id="loginPane">
    <form id="loginForm" autocomplete="on">
      <label>Email
        <input type="email" id="loginEmail" required placeholder="you@iitp.ac.in" />
      </label>
      <label>Password
        <input type="password" id="loginPassword" required minlength="6" />
      </label>
      <p class="error" id="loginError" hidden></p>
      <button class="btn primary" type="submit" id="loginBtn">Log in</button>
    </form>
  </section>

  <!-- ------------------------------ SIGNUP ----------------------------- -->
  <section class="card" id="signupPane" hidden>
    <form id="signupForm" autocomplete="on">
      <label>Full name
        <input type="text" id="suName" required placeholder="Utsav Kumar" />
      </label>

      <label>Roll number <span class="hint">(lowercase only)</span>
        <input type="text" id="suRoll" required placeholder="2311ai01"
               pattern="[a-z0-9_\-]{3,20}" />
        <small class="hint">It cannot be changed later.</small>
      </label>

      <label>Gender
        <select id="suGender" required>
          <option value="">Select…</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other</option>
          <option value="prefer_not_to_say">Prefer not to say</option>
        </select>
      </label>

      <label>Email
        <input type="email" id="suEmail" required placeholder="you@iitp.ac.in" />
      </label>

      <label>Password <span class="hint">(min 6 characters)</span>
        <input type="password" id="suPassword" required minlength="6" />
      </label>

      <p class="error" id="signupError" hidden></p>
      <button class="btn primary" type="submit" id="signupBtn">Create account</button>
    </form>
  </section>

  <p class="foot muted">Your data will save automatically as you work.</p>
</main>

<script type="module" src="js/auth.js"></script>
</body>
</html>
